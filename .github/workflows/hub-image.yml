# The Bothy hub Docker image (hub/Dockerfile) for amd64 and arm64, pushed to Docker Hub as one
# multi-arch tag. Each architecture builds natively on its own runner (no emulation), then a
# manifest joins them. Needs secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN, and optionally the
# variable HUB_IMAGE (default penpapertech/bothy). Run it by hand, or by pushing a tag hub-v1.2.3.
name: hub-image

on:
  workflow_dispatch:
  push:
    tags: ["hub-v*"]

env:
  IMAGE: ${{ vars.HUB_IMAGE || 'penpapertech/bothy' }}

jobs:
  build:
    # only the public repo publishes the image (AGPL: the image's source must be public too)
    if: github.repository == 'penpapertech/bothy'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: hub/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - run: |
          mkdir -p digests
          d="${{ steps.build.outputs.digest }}"
          touch "digests/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: digests/*
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag latest (and the version, for hub-v* tags)
        working-directory: digests
        run: |
          tags="-t $IMAGE:latest"
          case "$GITHUB_REF_NAME" in hub-v*) tags="$tags -t $IMAGE:${GITHUB_REF_NAME#hub-v}";; esac
          docker buildx imagetools create $tags $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:latest"
