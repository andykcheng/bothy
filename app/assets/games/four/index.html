<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Four in a Row</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #10141f; color: #eef; font: 16px system-ui, sans-serif; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; align-items: center; }
  header { width: 100%; max-width: 520px; display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; }
  button { font: inherit; color: inherit; background: #ffffff1a; border: 0; border-radius: 10px; padding: 9px 14px; }
  button.on { background: #2f6fd6; }
  #status { font-weight: 600; text-align: center; min-height: 24px; margin: 6px 0 10px; }
  #board { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; background: #1f4fb0; padding: 8px; border-radius: 14px; width: min(96vw, 500px); }
  .c { aspect-ratio: 1; border-radius: 50%; background: #10141f; transition: background .15s; }
  .c.r { background: radial-gradient(circle at 35% 35%, #ff8a7a, #e0362b); } .c.y { background: radial-gradient(circle at 35% 35%, #ffe680, #f1b10c); }
  .c.win { box-shadow: 0 0 0 4px #fff inset; }
  .c.drop { animation: drop .25s ease-in; } @keyframes drop { from { transform: translateY(-120%); } }
  #menu { position: fixed; inset: 0; background: #10141ff2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  #menu h1 { margin: 0 0 6px; } .opts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  #score { font-size: 14px; color: #aab; margin-top: 10px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header><button id="menuBtn">☰</button><b>Four in a Row</b><button id="undo">↶</button></header>
<div id="status"></div>
<div id="board"></div>
<div id="score"></div>
<div id="menu">
  <h1>🔴 Four in a Row 🟡</h1>
  <div>Drop discs; get four in a line — across, down or diagonal.</div>
  <div class="opts" id="mode"><button data-v="cpu1">vs Computer: Easy</button><button data-v="cpu2">Medium</button><button data-v="cpu3">Hard</button><button data-v="2p">2 players</button></div>
</div>
<script>
'use strict';
const W = 7, H = 6, $ = id => document.getElementById(id);
let B, turn, mode, over, hist, score = JSON.parse(localStorage.getItem('four.score') || '{"r":0,"y":0,"d":0}');
const cells = [];
for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) { const d = document.createElement('div'); d.className = 'c'; d.onclick = () => human(c); $('board').appendChild(d); cells.push(d); }
function start(m) {
  mode = m; B = Array(W * H).fill(0); turn = 1; over = false; hist = [];
  $('menu').classList.add('hidden'); draw();
}
function drop(b, c, p) { for (let r = H - 1; r >= 0; r--) if (!b[r * W + c]) { b[r * W + c] = p; return r; } return -1; }
function lines(b) {  // all winning lines of 4 as index arrays
  const L = [];
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
    const er = r + 3 * dr, ec = c + 3 * dc; if (er < 0 || er >= H || ec < 0 || ec >= W) continue;
    L.push([0, 1, 2, 3].map(k => (r + k * dr) * W + c + k * dc));
  }
  return L;
}
const LINES = lines();
function winner(b) { for (const l of LINES) { const v = b[l[0]]; if (v && v === b[l[1]] && v === b[l[2]] && v === b[l[3]]) return { p: v, l }; } return null; }
const full = b => b.slice(0, W).every(x => x);
function evalB(b) {  // from player 2's (computer's) point of view
  let s = 0;
  for (const l of LINES) { let a = 0, o = 0; for (const i of l) { if (b[i] === 2) a++; else if (b[i] === 1) o++; } if (a && o) continue; s += [0, 1, 8, 60][a] - [0, 1, 10, 80][o]; }
  for (let r = 0; r < H; r++) s += (b[r * W + 3] === 2 ? 3 : b[r * W + 3] === 1 ? -3 : 0);
  return s;
}
const ORDER = [3, 2, 4, 1, 5, 0, 6];
function negamax(b, d, a, beta, p) {
  const w = winner(b); if (w) return (w.p === p ? 1 : -1) * (100000 + d);
  if (full(b)) return 0;
  if (!d) return (p === 2 ? 1 : -1) * evalB(b);
  let best = -Infinity;
  for (const c of ORDER) {
    const r = drop(b, c, p); if (r < 0) continue;
    const v = -negamax(b, d - 1, -beta, -a, 3 - p); b[r * W + c] = 0;
    if (v > best) best = v; if (v > a) a = v; if (a >= beta) break;
  }
  return best;
}
function cpuMove() {
  const depth = { cpu1: 1, cpu2: 4, cpu3: 7 }[mode];
  let best = -Infinity, moves = [];
  for (const c of ORDER) {
    const r = drop(B, c, 2); if (r < 0) continue;
    let v = -negamax(B, depth - 1, -Infinity, Infinity, 1); B[r * W + c] = 0;
    if (mode === 'cpu1') v += Math.random() * 120;   // easy: often misses things
    if (v > best) { best = v; moves = [c]; } else if (v === best) moves.push(c);
  }
  return moves[Math.floor(Math.random() * moves.length)];
}
function play(c) {
  const r = drop(B, c, turn); if (r < 0) return false;
  hist.push(r * W + c); draw(r * W + c);
  const w = winner(B);
  if (w || full(B)) { over = true; const k = w ? (w.p === 1 ? 'r' : 'y') : 'd'; score[k]++; localStorage.setItem('four.score', JSON.stringify(score)); draw(-1, w); return true; }
  turn = 3 - turn; draw(-1); return true;
}
function human(c) {
  if (over || (mode !== '2p' && turn === 2)) return;
  if (!play(c)) return;
  if (!over && mode !== '2p') { $('status').textContent = 'Thinking…'; setTimeout(() => play(cpuMove()), 300); }
}
function draw(last = -1, w) {
  B.forEach((v, i) => { cells[i].className = 'c' + (v === 1 ? ' r' : v === 2 ? ' y' : '') + (i === last ? ' drop' : '') + (w && w.l.includes(i) ? ' win' : ''); });
  const name = p => mode === '2p' ? (p === 1 ? 'Red' : 'Yellow') : (p === 1 ? 'You' : 'Computer');
  $('status').textContent = over ? (w ? `${name(w.p)} win${mode !== '2p' && w.p === 1 ? '' : 's'}! Tap ☰ for a new game` : 'Draw!') : `${name(turn)}${mode !== '2p' && turn === 1 ? '' : '’s'} turn ${turn === 1 ? '🔴' : '🟡'}`;
  if (over && w && mode !== '2p') $('status').textContent = w.p === 1 ? '🎉 You win!' : 'The computer wins.';
  $('score').textContent = `🔴 ${score.r} · 🟡 ${score.y} · draws ${score.d}`;
}
$('mode').onclick = e => { const b = e.target.closest('button'); if (b) start(b.dataset.v); };
$('menuBtn').onclick = () => $('menu').classList.remove('hidden');
$('undo').onclick = () => {
  if (!hist.length || (mode !== '2p' && turn === 2 && !over)) return;
  const n = mode === '2p' ? 1 : (hist.length % 2 === 0 ? 2 : 1);
  for (let k = 0; k < n && hist.length; k++) B[hist.pop()] = 0;
  over = false; turn = mode === '2p' ? (hist.length % 2 ? 2 : 1) : 1; draw();
};
</script>
</body>
</html>
