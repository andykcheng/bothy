<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Emberdeep</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1a1424; color: #efe6d8; font: 14px system-ui, sans-serif; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; overflow: hidden; touch-action: manipulation; }
  body { display: flex; flex-direction: column; }
  #top { display: grid; grid-template-columns: auto 1fr 1fr auto; gap: 8px; align-items: center; padding: 6px 10px; background: #120e1a; }
  #where { font-size: 13px; line-height: 1.1; } #where small { display: block; font-weight: 400; color: #b8a9c9; font-size: 11px; }
  .bar { height: 9px; background: #0007; border-radius: 5px; overflow: hidden; position: relative; }
  .bar i { display: block; height: 100%; } .lab { font-size: 11px; color: #b8a9c9; white-space: nowrap; }
  #wrap { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  #log { position: absolute; left: 6px; right: 6px; bottom: 4px; font-size: 13px; pointer-events: none; text-shadow: 0 1px 2px #000, 0 0 3px #000; }
  #log div { opacity: .55; } #log div:last-child { opacity: 1; }
  #ctl { display: grid; grid-template-columns: 160px 1fr; gap: 8px; padding: 8px; background: #120e1a; }
  #pad { display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 46px); gap: 4px; }
  #acts { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 46px; gap: 4px; }
  #acts button { font-size: 15px; line-height: 1.05; } #acts button small { display: block; font-size: 10px; color: #d8cbe6; }
  button { font: inherit; color: inherit; background: #2e2440; border: 0; border-radius: 10px; padding: 0 4px; box-shadow: 0 3px 0 #0006; }
  button:active { transform: translateY(2px); box-shadow: none; }
  button:disabled { opacity: .35; } button.hot { background: #6b3fa0; } button.gold { background: #8a6a1c; } button.on { outline: 2px solid #f2c94c; }
  #pad button { font-size: 20px; }
  #ov { position: fixed; inset: 0; background: #000b; display: flex; align-items: flex-end; justify-content: center; z-index: 5; }
  #sheet { background: #241b33; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 14px 14px 20px; line-height: 1.45; }
  #sheet h2 { margin: 2px 0 8px; font-size: 18px; display: flex; align-items: center; gap: 8px; line-height: 1.2; }
  #sheet h3 { margin: 14px 0 4px; font-size: 15px; color: #f2c94c; }
  #sheet p { margin: 8px 0; } #sheet .story { font-size: 15px; } #sheet .say { font-style: italic; color: #f3e3c3; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; } .row button { flex: 1; min-height: 44px; padding: 4px 8px; }
  .item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #ffffff12; }
  .item .n { flex: 1; } .item small { display: block; color: #b8a9c9; } .item button { min-height: 38px; padding: 0 12px; }
  canvas.ic { position: static; width: 40px; height: 40px; flex: none; } canvas.ic.sm { width: 28px; height: 28px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 8px; } .tabs button { flex: 1; min-height: 36px; }
  .dim { color: #b8a9c9; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="top">
  <b id="where"></b>
  <div><div class="lab" id="hpl"></div><div class="bar"><i id="hpb" style="background:#e0533d"></i></div></div>
  <div><div class="lab" id="mpl"></div><div class="bar"><i id="mpb" style="background:#4f8fe0"></i></div></div>
  <b id="goldl" style="color:#f2c94c"></b>
</div>
<div id="wrap"><canvas id="cv"></canvas><div id="log"></div></div>
<div id="ctl">
  <div id="pad">
    <span></span><button data-d="0,-1">▲</button><span></span>
    <button data-d="-1,0">◀</button><button data-a="wait" title="Wait">⏳</button><button data-d="1,0">▶</button>
    <span></span><button data-d="0,1">▼</button><span></span>
  </div>
  <div id="acts">
    <button data-a="skill" id="skillB" class="hot">Skill</button><button data-a="skill2" id="skill2B" class="hot">Skill</button><button data-a="explore">🧭<small>Explore</small></button><button data-a="stairs" id="stairsB">⬇<small>Stairs</small></button>
    <button data-a="pr" id="prB">❤️ 0</button><button data-a="pb" id="pbB">💙 0</button><button data-a="pg" id="pgB">💚 0</button><button data-a="scroll" id="scB">📜 0</button>
    <button data-a="hero">🧙<small>Hero</small></button><button data-a="journal">📖<small>Journal</small></button><button data-a="menu">☰<small>Menu</small></button><span></span>
  </div>
</div>
<div id="ov" class="hidden"><div id="sheet"></div></div>
<script>
'use strict';
// Emberdeep — an original fantasy dungeon campaign. Art: Kenney "Tiny Dungeon" (CC0).
const $ = id => document.getElementById(id);
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const TS = 16, SHEET = new Image(); SHEET.src = 'tiles.png';
// tile ids in Kenney's Tiny Dungeon sheet (12 columns)
const T = { stairs: 18, banner: 29, gold: 101, shield: 102, potR: 115, potB: 116, potG: 114, chest: 89, chestOpen: 91, mimic: 92, spikes: 41, page: 66,
  shrine: 32, altar: 31, fountain: 8, fountainDry: 7, head: 19, stone: 65, crystal: 56, barrel: 82, table: 72, stool: 73, shelf: 63, anvil: 74 };

// ---- the campaign ------------------------------------------------------------------------------------------
const CLASSES = {
  knight: { n: 'Knight', t: 96, hp: 34, mp: 6, atk: 4, def: 2, crit: .05, e: '🛡️',
    skill: 'Shield bash', sd: 'Your next blow does double damage and stuns for 2 turns.', cost: 3,
    skill2: 'Rally', sd2: 'Catch your breath mid-fight: heal a third of your health.', cost2: 5 },
  rogue: { n: 'Rogue', t: 88, hp: 26, mp: 8, atk: 4, def: 1, crit: .2, e: '👤',
    skill: 'Shadowstep', sd: 'Vanish for 6 turns. Monsters lose you; your next strike is a triple critical.', cost: 4,
    skill2: 'Knife fan', sd2: 'Throw knives at every monster within 2 steps.', cost2: 5 },
  wizard: { n: 'Wizard', t: 84, hp: 22, mp: 12, atk: 2, def: 0, crit: .05, e: '🔥',
    skill: 'Firebolt', sd: 'Hurl fire at the nearest monster you can see (5 + 1.5×level + wand power).', cost: 3,
    skill2: 'Frost nova', sd2: 'Freeze every monster within 3 steps: damage and 2 turns stunned.', cost2: 6 },
};
const SKILL2_LV = 5;
const WEAPONS = [
  { n: 'Dagger', t: 103, atk: 1 }, { n: 'Short sword', t: 104, atk: 2 }, { n: 'Cleaver', t: 105, atk: 3 }, { n: 'Spear', t: 131, atk: 4 },
  { n: 'Broadsword', t: 106, atk: 5 }, { n: 'War hammer', t: 117, atk: 7 }, { n: 'Axe', t: 119, atk: 8 }, { n: 'Battle axe', t: 118, atk: 10 },
  { n: 'Ember blade', t: 107, atk: 12 }, { n: 'Deepforge axe', t: 119, c: '#8ab0e0', atk: 14 }, { n: 'Runed hammer', t: 117, c: '#60e0e0', atk: 16 },
  { n: 'Knight’s longsword', t: 106, c: '#c8d0ff', atk: 18 }, { n: 'Templar blade', t: 104, c: '#ffd060', atk: 20 }, { n: 'Drakebone spear', t: 131, c: '#ff9050', atk: 22 },
];
const WYRMFANG = { n: 'Wyrmfang', t: 107, c: '#ff5020', atk: 27 }, DAWNBRAND = { n: 'Dawnbrand', t: 106, c: '#fff090', atk: 30 };
const WANDS = [{ n: 'Amethyst wand', t: 129, pow: 3 }, { n: 'Frost wand', t: 130, pow: 6 }, { n: 'Storm wand', t: 130, c: '#ffe060', pow: 10 },
  { n: 'Ember staff', t: 129, c: '#ff8040', pow: 15 }, { n: 'Star wand', t: 129, c: '#a0c0ff', pow: 20 }, { n: 'Dawn sceptre', t: 130, c: '#fff090', pow: 26 }];

// monsters: mh/ma/md/mx scale health, attack, defence, xp against the hero we expect on that floor
const M_ = (id, n, t, c, mh, ma, md, mx, ai = '', extra = {}) => ({ id, n, t, c, mh, ma, md, mx, ai, ...extra });
const CH = [
  { n: 'The Old Mines', s: 'Old Mines', f0: 1, style: 'rooms', fl: [1, 24, 12], wall: [40, 57], top: ['#33261c', '#4a382a'], tint: '#f2dcc4', light: '#ffb45a', deco: [82, 82, 65, 72, 73, 63], feat: [29],
    mons: [M_('rat', 'Giant rat', 123, '', .7, .6, .5, .8), M_('bat', 'Cave bat', 120, '', .6, .6, .3, .8, 'flutter'), M_('slime', 'Green slime', 108, '', 1.3, .6, 1, 1, 'slow'),
      M_('spider', 'Tunnel spider', 122, '', .9, .8, .5, 1.2, 'poison', { d: 2 }), M_('crawler', 'Rock crawler', 124, '', 1.3, .9, 1.6, 1.4, '', { d: 3 })],
    boss: M_('grumm', 'Grumm the Cyclops', 109, '', 7, 2.1, 1.3, 12, 'quake', { boss: 1, sc: 1.5, title: 'the gatekeeper' }),
    intro: `Cinderfold was a mining town before it was anything else. Last spring the miners broke through into older tunnels — dwarf-cut, the old folk said, from before the town had a name. Since then the lamps burn red in the deep shafts, miners go missing, and things climb out at night.<br><br>The mayor’s daughter was taken a week ago. Father Vharex, the town priest, went down after her and never came back. The mayor has posted a reward. You light your lamp and go down.`,
    amb: ['Somewhere, a pick-axe taps — then stops.', 'An empty ore cart creaks on its rails.', 'The lamplight flickers red for a moment.', 'Chalk arrows on the wall point down.', 'You smell hot iron, very far below.'] },
  { n: 'The Drowned Crypts', s: 'Drowned Crypts', f0: 6, style: 'crypt', fl: [36, 37, 39], wall: [57, 59], top: ['#1c2232', '#2a3450'], tint: '#a9bde0', light: '#7fb0ff', deco: [64, 64, 65, 66, 82], feat: [8, 7],
    mons: [M_('ghost', 'Wailing ghost', 121, '', .8, .9, .6, 1.1, 'ghost'), M_('ghoul', 'Crypt ghoul', 98, '#7fbf7f', 1.1, 1, 1, 1.2, 'drain'), M_('gspider', 'Grave spider', 122, '#9a6ad0', .9, .9, .6, 1.1, 'poison'),
      M_('drowned', 'Drowned one', 108, '#4a70c0', 1.6, .9, 1.3, 1.3, 'slow'), M_('archer', 'Bone archer', 97, '*#d8d0b8', .8, .8, .8, 1.2, 'caster', { sp: 'bone arrow', d: 7 }), M_('cbat', 'Crypt bat', 120, '#8a5ac0', .6, .7, .4, .8, 'flutter')],
    boss: M_('ossa', 'Mother Ossa', 100, '#9fe09f', 7.5, 1.8, 1.2, 13, 'caster', { boss: 1, sc: 1.5, sp: 'grave-curse', title: 'the Bone Witch', summon: ['ghost', 'archer'], every: 6, sumMsg: 'Mother Ossa lifts her lantern: “Up, my sleepers!” The dead rise.' }),
    intro: `Below the mines the tunnels open into flooded halls lined with stone coffins: the tombs of the dwarves who dug here first. The water is black and very still, and it remembers things. Something down here is waking the dead — and selling the living.`,
    amb: ['Water drips somewhere, steady as a heartbeat.', 'A coffin lid shifts, just slightly.', 'Your breath fogs in the cold.', 'Faint singing echoes, then stops.', 'The water at your feet is very, very still.'] },
  { n: 'The Gilded Vaults', s: 'Gilded Vaults', f0: 11, style: 'vault', fl: [42, 48, 49], wall: [40, 58], top: ['#2e2818', '#4a4026'], tint: '#f5e3a0', light: '#ffd870', deco: [63, 75, 72, 82, 74, 56], feat: [29],
    mons: [M_('robber', 'Vault robber', 112, '', .9, 1, .8, 1), M_('warden', 'Iron warden', 87, '#8aa8e0', 1.6, 1, 2, 1.4, 'slow'), M_('coins', 'Coin swarm', 101, '#ffd34a', .7, 1, .5, 1, 'fast'),
      M_('ogre', 'Stone ogre', 109, '*#b0b0b0', 1.8, 1.3, 1.2, 1.5), M_('armour', 'Living armour', 96, '*#606878', 1.2, 1.1, 1.8, 1.3)],
    boss: M_('mimicking', 'The Mimic King', 92, '#ffd060', 8, 1.9, 1.5, 14, '', { boss: 1, sc: 1.7, title: 'the hoard that hungers', summon: ['coins'], every: 5, sumMsg: 'The Mimic King spits a torrent of living coins!' }),
    intro: `Past the crypts stand the doors of the Deepforge vaults, where King Durmek Stonehand kept the wealth of a hundred years of mining. The dwarves vanished long ago. Their gold did not — and down here, gold has learned to bite.`,
    amb: ['Coins clink in the dark, though nothing moves.', 'Rows of empty armour stand to attention.', 'A dwarf rune glows faintly, then fades.', 'The air tastes of metal.', 'Somewhere a heavy door grinds shut.'] },
  { n: 'The Temple of Embers', s: 'Ember Temple', f0: 16, style: 'rooms', fl: [48, 49, 51], wall: [40, 57], top: ['#3a1c18', '#58302a'], tint: '#f7b8a0', light: '#ff7a3a', deco: [31, 72, 73, 64, 82], feat: [29, 20],
    mons: [M_('cultist', 'Ember cultist', 111, '', .9, 1, .8, 1.1, 'caster', { sp: 'ember bolt' }), M_('wisp', 'Flame wisp', 121, '#ff9030', .7, 1, .5, 1, 'ghost', { burn: 1 }),
      M_('hound', 'Cinder hound', 124, '#e05030', 1, 1.1, 1, 1.2, 'fast'), M_('acolyte', 'Fire acolyte', 84, '#e04040', .9, 1, .8, 1.2, 'caster', { sp: 'firebrand' }), M_('zealot', 'Ember zealot', 112, '#d05030', 1.4, 1.2, 1.4, 1.4)],
    boss: M_('vharex', 'Father Vharex', 111, '#ffb040', 8, 1.8, 1.4, 15, 'caster', { boss: 1, sc: 1.5, sp: 'fire storm', title: 'the Ember Priest', summon: ['cultist', 'acolyte'], every: 7, blink: 1, sumMsg: 'Vharex raises his hands: “Brothers, sisters — to me!”' }),
    intro: `The dwarf halls give way to a temple carved in red stone, its braziers lit and its walls freshly painted with flames. This is the Ember Cult’s work, and it is not old at all. Somewhere ahead, voices are singing a hymn you almost recognise — the Dawn hymn from Cinderfold’s chapel, sung backwards.`,
    amb: ['A hymn echoes from far away, sung backwards.', 'Braziers flare as you pass.', 'Fresh red paint drips down a carved flame.', 'Ash drifts down like snow.', 'You hear a bell, slow and deep.'] },
  { n: 'Wyrmhollow', s: 'Wyrmhollow', f0: 21, style: 'cave', fl: [1, 12, 24], wall: [57, 58], top: ['#2a120c', '#4a2014'], tint: '#ff9a7a', light: '#ff5a20', deco: [65, 65, 56, 64], feat: [],
    mons: [M_('drake', 'Ember drake', 110, '#ff8a30', 1.2, 1.1, 1.2, 1.3), M_('sala', 'Salamander', 108, '#ff5a20', 1.4, 1, 1.3, 1.2, 'slow', { burn: 1 }), M_('fbat', 'Fire bat', 120, '#ff7020', .6, .9, .5, .9, 'flutter'),
      M_('scaled', 'Scaled zealot', 88, '#60b060', .9, 1, .9, 1.2, 'caster', { sp: 'flame spit' }), M_('mogre', 'Magma ogre', 109, '#ff4020', 1.9, 1.3, 1.4, 1.6)],
    boss: M_('sythra', 'Sythra', 110, '#ffb000', 11, 2, 1.6, 18, 'breath', { boss: 1, sc: 2.2, title: 'the Cinder Wyrm' }),
    intro: `Heat rolls up from the deep. The walls here are not cut but melted. The cult’s maps call this place Wyrmhollow, and every one of them carries the same warning scratched beside it: DO NOT WAKE THE WARDEN.`,
    amb: ['The rock under your hand is warm.', 'Something enormous shifts in its sleep, far off.', 'A gust of hot wind, like breath.', 'Black glass crunches underfoot.', 'Old chains, as thick as your arm, lie melted on the floor.'] },
  { n: 'The Sleeper’s Heart', s: 'Sleeper’s Heart', f0: 26, style: 'rooms', fl: [48, 42, 49], wall: [59, 40], top: ['#22101e', '#3a1a30'], tint: '#c79ad0', light: '#c050ff', deco: [65, 56, 64, 31], feat: [19],
    mons: [M_('fiend', 'Pit fiend', 110, '', 1.2, 1.1, 1.2, 1.3), M_('shadow', 'Living shadow', 121, '*#303048', .8, 1, .6, 1.1, 'ghost', { drain: 1 }), M_('doom', 'Doom knight', 96, '#a02030', 1.5, 1.2, 1.8, 1.5),
      M_('golem', 'Ember golem', 109, '#ff9a40', 2, 1.3, 1.6, 1.6, 'slow'), M_('gnawer', 'Soul gnawer', 123, '#c03040', .7, 1, .6, 1, 'fast')],
    boss: M_('ashmaw', 'Ashmaw', 110, '#9040c0', 15, 2.1, 1.8, 30, 'caster', { boss: 1, sc: 2.6, sp: 'hellfire', title: 'the Sleeper Beneath', phases: 1 }),
    intro: `The last stairs lead down into a heat like a forge-mouth. Dwarf runes glow in the rock, and they are cracking, one by one. Somewhere below, something enormous is breathing — slowly, the way a sleeper breathes just before waking.`,
    amb: ['A rune in the wall cracks with a sound like a bell.', 'The floor rises and falls, ever so slightly.', 'Whispers, in a voice too big for words.', 'Your shadow moves a moment after you do.', 'The heat presses on you like a hand.'] },
  { n: 'The Endless Dark', s: 'Endless Dark', f0: 31, style: 'cave', fl: [36, 37, 39], wall: [59, 57], top: ['#141418', '#24242c'], tint: '#9a9aaa', light: '#a0a0ff', deco: [65, 64, 56], feat: [],
    mons: [], boss: null,
    intro: `Beyond the Heart the stairs keep going down, into a dark that has no name and no map. There is no story here — only depth, and whatever lives in it.`,
    amb: ['Silence.', 'Nothing has walked here for a very long time.', 'The dark seems to lean in.'] },
];
CH[6].mons = CH.slice(0, 6).flatMap(c => c.mons);
const chOf = f => f <= 0 ? null : f > 30 ? CH[6] : CH[Math.floor((f - 1) / 5)];
const MONDEF = {}; for (const c of CH) { for (const m of c.mons) MONDEF[m.id] = m; if (c.boss) MONDEF[c.boss.id] = c.boss; }
const BOSSES = { 5: CH[0].boss, 10: CH[1].boss, 15: CH[2].boss, 20: CH[3].boss, 25: CH[4].boss, 30: CH[5].boss };

const BOSS_TEXT = {
  grumm: [`A one-eyed giant squats among broken mine carts, a rusted chain still locked around one ankle. <span class="say">“GRUMM GUARDS THE DOOR,”</span> it booms. <span class="say">“LITTLE PRIEST SAYS: NOBODY PASSES.”</span> It hefts a club made from a pit prop.`,
    `Grumm sits down heavily. <span class="say">“Grumm… tired. Priest promised Grumm the sky again.”</span> The giant’s eye slides shut and it begins, enormously, to snore. Tucked in its belt you find a scrap of red cloth stitched with an ember — the mark of the Ember Cult.`],
  ossa: [`The black water stills. A crooked woman of bone and wet linen rises from a sarcophagus, a lantern of green fire in her hand. <span class="say">“Another bright little life come to visit my sleepers? The Priest pays me in names, child. I shall add yours to the ledger.”</span>`,
    `Mother Ossa crumbles into wet bones and green ash. Her lantern gutters out, and all through the crypt you hear the drowned dead sigh and lie still. Among her things is a ledger of names — miners from Cinderfold, sold to the Ember Priest one by one.`],
  mimicking: [`The vault doors stand open on a mountain of gold. Then the mountain opens one enormous eye. Coins slide away from a lid as wide as a cart, and a tongue the colour of a wound rolls out. King Durmek’s hoard has grown hungry.`,
    `The great mimic shudders and splits, spilling a tide of coins. Deep in its gullet lies King Durmek’s crown, and pressed into the gold, a single word in dwarven runes: <b>SEAL</b>.`],
  vharex: [`Before the burning altar stands a man in priest’s white, scorched to grey. You know him. Everyone in Cinderfold knows him — Father Vharex, who blessed every child in town and every miner’s lamp. <span class="say">“Turn back,”</span> he says gently. <span class="say">“Can you not hear him? He is dreaming of us. When he wakes there will be no more cold, no more hunger, no more dark. Only fire.”</span>`,
    `Vharex falls to his knees. The fire goes out of his eyes and for a moment he is only an old, frightened man. <span class="say">“I heard it in the dark,”</span> he whispers. <span class="say">“Forty years I prayed to the Dawnmother and she never answered. It answered.”</span> He presses an iron key into your hand — the key to the Warden’s gate — and is still.`],
  sythra: [`The cavern is a furnace. Coiled about a pillar of black glass lies a dragon the colour of a dying coal, dwarf-iron chains broken on her limbs. <span class="say">“I was the Warden,”</span> she says, and the stone hums with her voice. <span class="say">“Four hundred years I lay upon the seal so the Sleeper would not wake. Then the priest came and sang to me, and I forgot what I was for. Leave, little ember. Or burn.”</span>`, ''],
  ashmaw: [`The Heart of Emberdeep is a cathedral of molten stone. At its centre, bound by runes older than Cinderfold, something vast uncoils: Ashmaw, the Sleeper Beneath, wakes. Its voice is everywhere at once. <span class="say">“SMALL. WARM. YOU WILL DO.”</span>`, ''],
};

// one lore page per floor
const PAGES = [
  ['Tobin’s journal, day 1', `The new shaft breaks into a tunnel no miner dug: square-cut, with runes on the lintels. The mayor wants a map before anyone goes further. Packed chalk, string, three candles. Hanna says I am too old for this. She is right. — T. Ashgrove, cartographer`],
  ['Tobin’s journal, day 3', `Rats the size of dogs. The miners say they came up with the red light. I have marked the safe paths in chalk: an arrow pointing down means “down”; an arrow pointing up means “run”.`],
  ['Tobin’s journal, day 4', `Found a dwarf door, half buried. Carved above it: a sleeping figure wrapped in chains, and a dragon coiled on top of it. I copied it carefully. Something about it made my hands shake.`],
  ['Tobin’s journal, day 6', `Saw people in red robes with lanterns. They had a giant on a chain — one eye, big as a cartwheel. They called it Grumm and fed it bread. I hid in an ore cart until they passed. One of them had Father Vharex’s voice.`],
  ['Tobin’s journal, day 7', `They have found me. If you are reading this, tell Hanna I mapped as far as Grumm’s door and no further. The rest of the map is in my head. Look for me below.`],
  ['A dwarf epitaph', `Carved deep in a coffin lid: HERE LIES BORIN FLINTBROW, WHO KEPT THE WATCH. MAY THE STONE KEEP HIM AS HE KEPT THE SEAL.`],
  ['Scrawled on a burial list', `The dead here do not rest. A woman made of bones talks to them like children. She trades with the cult: their prisoners for her lantern oil. I am in a cage of ribs. It is surprisingly comfortable. I am lying. — T.A.`],
  ['From Mother Ossa’s ledger', `Received from the Priest: twelve souls, miners, healthy. Paid: the names of the seven dwarves who sang the Seal, from the old tombs. He wants to know who can sing the Sealing Song. He will not like the answer: they are all dead.`],

    if (n.k === 'captive' || n.k === 'peddler' || n.k === 'wounded') { g.fillStyle = n.k === 'captive' ? '#ffe08a44' : '#ffffff22'; g.beginPath(); g.arc(px + s / 2, py + s / 2, s * .55, 0, 7); g.fill(); }
    tile(n.t, px, py, s, n.c);
    if (n.k === 'captive') { g.font = `${s * .4}px sans-serif`; g.fillText('❗', px + s * .62, py + s * .3); }
  }
  for (const m of S.mons) {
    if (!VIS.has(idx(m.x, m.y))) continue;
    const px = ox + m.x * s, py = oy + m.y * s, bs = Math.round(s * m.sc), bx = px + s / 2 - bs / 2, by = py + s - bs;
    if (m.boss || m.elite) { g.fillStyle = m.boss ? '#ff6a2a40' : '#ffcc3340'; g.beginPath(); g.arc(px + s / 2, py + s - bs / 2, bs * .6, 0, 7); g.fill(); }
    tile(m.t, bx, by, bs, m.c);
    if (hitFx.has(m)) { g.globalCompositeOperation = 'lighter'; g.fillStyle = '#ff303050'; g.fillRect(bx, by, bs, bs); g.globalCompositeOperation = 'source-over'; }
    if (m.hp < m.mhp && !m.boss) { g.fillStyle = '#000a'; g.fillRect(px + s * .1, by - s * .12, s * .8, s * .09); g.fillStyle = '#e0533d'; g.fillRect(px + s * .1, by - s * .12, s * .8 * Math.max(0, m.hp) / m.mhp, s * .09); }
    if (m.stun) { g.font = `${s * .4}px sans-serif`; g.fillText('💫', px + s * .55, by + s * .3); }
    if (m.warn) { g.font = `${s * .5}px sans-serif`; g.fillText('⚠️', px + s * .5, by - s * .05); }
  }
  {
    const hx = ox + S.px * s, hy = oy + S.py * s;
    g.globalAlpha = S.inTown ? .85 : S.st.invis ? .45 : 1; tile(CLASSES[S.cls].t, hx, hy, s); g.globalAlpha = 1;
  }
  // fog over remembered but unseen cells; coloured light around the hero
  for (let y = y0; y < y0 + rows; y++) for (let x = x0; x < x0 + cols; x++) {
    if (!inside(x, y)) continue; const i = idx(x, y);
    if (S.map.seen[i] && !VIS.has(i)) { g.fillStyle = '#0d0a12b0'; g.fillRect(ox + x * s, oy + y * s, s, s); }
  }
  if (ch) {
    const gr = g.createRadialGradient(cv.width / 2, cv.height / 2, s * 2, cv.width / 2, cv.height / 2, s * 7.5);
    gr.addColorStop(0, ch.light + '12'); gr.addColorStop(1, '#0d0a1280'); g.fillStyle = gr; g.fillRect(0, 0, cv.width, cv.height);
  }
  if (bolt) { g.strokeStyle = bolt.c || '#ffb02e'; g.lineWidth = s / 6 * (bolt.w || 1); g.lineCap = 'round'; g.beginPath(); g.moveTo(ox + (bolt.x0 + .5) * s, oy + (bolt.y0 + .5) * s); g.lineTo(ox + (bolt.x1 + .5) * s, oy + (bolt.y1 + .5) * s); g.stroke(); }
  g.textAlign = 'center'; g.font = `bold ${Math.round(s * .38)}px system-ui`;
  for (const p of pops) { g.lineWidth = 4; g.strokeStyle = '#000'; g.strokeText(p.t, ox + (p.x + .5) * s, oy + p.y * s); g.fillStyle = p.c; g.fillText(p.t, ox + (p.x + .5) * s, oy + p.y * s); }
  // the guardian's health across the top
  const boss = S.mons.find(m => m.boss && VIS.has(idx(m.x, m.y)));
  if (boss) {
    const bw = cv.width * .8, bx = cv.width * .1, by = 10 * dpr, bh = 9 * dpr;
    g.fillStyle = '#000c'; g.fillRect(bx - 2, by - 2, bw + 4, bh + 4); g.fillStyle = '#ff8a2a'; g.fillRect(bx, by, bw * Math.max(0, boss.hp) / boss.mhp, bh);
    g.font = `bold ${12 * dpr}px system-ui`; g.lineWidth = 3 * dpr; g.strokeStyle = '#000'; const lbl = `${boss.n} — ${boss.hp}/${boss.mhp}`; g.strokeText(lbl, cv.width / 2, by + bh + 14 * dpr); g.fillStyle = '#ffd8b0'; g.fillText(lbl, cv.width / 2, by + bh + 14 * dpr);
  }
  if (shake || bolt) { shake = 0; bolt = null; setTimeout(draw, 160); }   // one settle frame, then idle (no animation loop)
  hud();
}
function hud() {
  const inTown = S.inTown, c = CLASSES[S.cls], ch = chOf(S.floor);
  $('where').innerHTML = S.floor === 0 ? '🏘️ Cinderfold' : `⛏️ Floor ${S.floor}<small>${ch.s}</small>`;
  $('hpl').textContent = inTown ? 'Choose a hero' : `❤️ ${Math.max(0, S.hp)}/${S.mhp}  ·  Lv ${S.lv}`; $('hpb').style.width = inTown ? '0' : 100 * Math.max(0, S.hp) / S.mhp + '%';
  $('hpb').style.background = S.st && S.st.poison ? (S.st.burning ? '#ff8a2a' : '#7bc043') : '#e0533d';
  $('mpl').textContent = inTown ? '' : `💙 ${S.mp}/${S.mmp}  ·  XP ${Math.round(100 * S.xp / xpNext())}%`; $('mpb').style.width = inTown ? '0' : 100 * S.mp / Math.max(1, S.mmp) + '%';
  $('goldl').textContent = `🪙 ${S.floor === 0 ? M.gold : S.gold || 0}`;
  $('skillB').innerHTML = inTown ? 'Skill' : `${c.e}<small>${c.skill.split(' ').pop()}</small>`;
  $('skillB').disabled = inTown || S.floor === 0 || S.mp < c.cost;
  $('skill2B').innerHTML = inTown ? '✨' : S.lv < SKILL2_LV ? `🔒<small>Lv ${SKILL2_LV}</small>` : `✨<small>${c.skill2.split(' ').pop()}</small>`;
  $('skill2B').disabled = inTown || S.floor === 0 || S.lv < SKILL2_LV || S.mp < c.cost2;
  for (const k of ['potR', 'potB', 'potG']) { const b = $({ potR: 'prB', potB: 'pbB', potG: 'pgB' }[k]); b.textContent = `${{ potR: '❤️', potB: '💙', potG: '💚' }[k]} ${S.pots[k] || 0}`; b.disabled = !S.pots[k] || inTown; }
  const ns = S.scr ? S.scr.fire + S.scr.tele + S.scr.map : 0; $('scB').textContent = `📜 ${ns}`; $('scB').disabled = !ns || inTown;
  $('stairsB').classList.toggle('gold', cell(S.px, S.py) === 2);
  $('log').innerHTML = S.log.slice(-3).map(l => `<div>${l}</div>`).join('');
}
// ---- input ------------------------------------------------------------------------------------------------------------
$('pad').onclick = e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.a === 'wait') { if (S && !S.inTown && S.floor > 0) act('wait'); return; } const [dx, dy] = b.dataset.d.split(',').map(Number); move(dx, dy); };
function move(dx, dy) {
  if (!S || busy()) return;
  if (S.inTown) { const nx = S.px + dx, ny = S.py + dy; const n = npcAt(nx, ny); if (n) return meet(n); if (walkable(nx, ny)) { S.px = nx; S.py = ny; fov(); if (cell(nx, ny) === 2) log('The stairs down. Tap ⬇ Stairs to choose a hero and descend.'); } draw(); return; }
  act('move', dx, dy);
}
$('acts').onclick = e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const a = b.dataset.a;
  if (a === 'skill') skill(1); if (a === 'skill2') skill(2); if (a === 'explore') explore(); if (a === 'stairs') stairs();
  if (a === 'pr') drink('potR'); if (a === 'pb') drink('potB'); if (a === 'pg') drink('potG'); if (a === 'scroll') scrollSheet();
  if (a === 'hero') heroInfo(); if (a === 'journal') journal(); if (a === 'menu') menu();
};
cv.addEventListener('pointerdown', e => {
  if (!S) return; const r = cv.getBoundingClientRect(), dx = e.clientX - r.left - r.width / 2, dy = e.clientY - r.top - r.height / 2;
  if (Math.abs(dx) < 14 && Math.abs(dy) < 14) return;
  if (Math.abs(dx) > Math.abs(dy)) move(Math.sign(dx), 0); else move(0, Math.sign(dy));
});
addEventListener('keydown', e => { const k = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] }[e.key]; if (k) { e.preventDefault(); move(...k); } if (e.key === ' ' && S && !S.inTown) act('wait'); });
addEventListener('resize', () => draw());
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('sp-pause', save);
SHEET.onload = () => {
  loadMeta();
  try { S = JSON.parse(localStorage.getItem(RUN)); } catch (e) { S = null; }
  if (S && S.v === 2 && S.map && !S.dead) { fov(); draw(); } else heroSelect();
};
