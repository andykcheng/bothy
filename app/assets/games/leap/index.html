<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Leap</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0d0f1a; color: #eef; font: 16px system-ui, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; top: 8px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
  #hud button { pointer-events: auto; }
  #menu { position: fixed; inset: 0; overflow-y: auto; background: #0d0f1aee; padding: 20px 16px; }
  #menu h1 { margin: 0 0 4px; text-align: center; letter-spacing: 4px; }
  #menu p { text-align: center; color: #99a; margin: 0 0 16px; }
  #levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; max-width: 640px; margin: 0 auto; }
  .lv { background: #1c2034; border: 0; color: #eef; border-radius: 10px; padding: 14px 10px; text-align: left; font-size: 16px; }
  .lv b { display: block; font-size: 18px; } .lv small { color: #99a; }
  .lv .bar { height: 5px; background: #2c3150; border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .lv .bar i { display: block; height: 100%; background: #6cf; }
  .lv.locked { opacity: .4; }
  button.small { background: #fff2; color: #eef; border: 0; border-radius: 8px; padding: 8px 14px; font-size: 16px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden"><button class="small" id="back">☰</button><span id="info"></span><button class="small" id="pause">II</button></div>
<div id="menu">
  <h1>LEAP</h1>
  <p>Tap (or hold) anywhere to jump. Land on blocks, never touch a spike.<br>Clear a level to unlock the next.</p>
  <div id="levels"></div>
</div>
<script>
'use strict';
// World units are tiles. The square runs right at constant speed; one tap = one jump.
const SPEED = 9.5, GRAV = 110, JUMP = 22, DT = 1 / 120;   // jump: 2.2 tiles high, ~3.8 tiles long
const LEVELS = 10;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let W, H, T, groundY;   // canvas size, pixels per tile, ground line in pixels

function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

// Obstacle patterns. Each is clearable with one jump from the ground or from the block it starts on.
// Spikes: {s:1,x,y}; blocks: {b:1,x,y,w,h}. Returns the pattern's width.
const PATTERNS = [
  { min: 0, w: 1, make: (o, x) => o.push({ s: 1, x, y: 0 }) },
  { min: 0.15, w: 2, make: (o, x) => { o.push({ s: 1, x, y: 0 }, { s: 1, x: x + 1, y: 0 }); } },
  { min: 0, w: 4, make: (o, x, r) => { const w = 2 + Math.floor(r() * 3); o.push({ b: 1, x, y: 0, w, h: 1 }); return w; } },
  { min: 0.2, w: 7, make: (o, x) => { o.push({ b: 1, x, y: 0, w: 2, h: 1 }, { b: 1, x: x + 3, y: 0, w: 4, h: 2 }); return 7; } },
  { min: 0.3, w: 6, make: (o, x) => { o.push({ b: 1, x, y: 0, w: 6, h: 1 }, { s: 1, x: x + 3, y: 1 }); return 6; } },
  { min: 0.35, w: 8, make: (o, x) => {   // spike pit between two blocks
    o.push({ b: 1, x, y: 0, w: 2, h: 1 }, { s: 1, x: x + 2, y: 0 }, { s: 1, x: x + 3, y: 0 }, { b: 1, x: x + 4, y: 0, w: 3, h: 1 }); return 7; } },
  { min: 0.45, w: 8, make: (o, x, r) => {   // floating ledge over a spike floor
    const w = 5 + Math.floor(r() * 4);
    o.push({ b: 1, x, y: 1.4, w, h: 0.4 });
    for (let i = 1; i < w - 1; i++) o.push({ s: 1, x: x + i, y: 0 });
    return w; } },
  { min: 0.55, w: 6, make: (o, x) => { o.push({ s: 1, x, y: 0 }, { b: 1, x: x + 1, y: 0, w: 3, h: 1 }, { s: 1, x: x + 4, y: 0 }); return 5; } },
  { min: 0.6, w: 9, make: (o, x) => {   // stairs up, then a spike on the top step
    o.push({ b: 1, x, y: 0, w: 2, h: 1 }, { b: 1, x: x + 3, y: 0, w: 2, h: 2 }, { b: 1, x: x + 6, y: 0, w: 4, h: 3 }, { s: 1, x: x + 9, y: 3 }); return 10; } },
];

function build(seed, length, d0, d1) {
  const r = mulberry32(seed), obs = [];
  let x = 14;
  while (length === Infinity ? x < 400 : x < length - 10) {
    const d = length === Infinity ? d0 : d0 + (d1 - d0) * x / length;
    x = extend(obs, x, d, r);
  }
  return { obs, r, x };
}

function extend(obs, x, d, r) {
  const options = PATTERNS.filter(p => p.min <= d + 0.05);
  const p = options[Math.floor(r() * options.length)];
  const w = p.make(obs, x, r) || p.w;
  return x + w + 3.6 + (1 - d) * 4 + r() * 3;   // room to land and react
}

let game = null, raf = 0, last = 0, acc = 0, holding = false;

function startLevel(n) {
  // n = 1..LEVELS, or 0 for endless
  const endless = n === 0;
  const length = endless ? Infinity : 160 + n * 40;
  const lv = build(endless ? (Date.now() & 0xffffff) : n * 7919, length, endless ? 0.1 : 0.05 + n * 0.07, endless ? 0.1 : 0.25 + n * 0.075);
  const attempts = game && game.n === n ? game.attempts + 1 : 1;
  game = { n, endless, length, ...lv, attempts, px: 0, py: 0, vy: 0, ground: true, rot: 0, dead: 0, won: 0, parts: [], hue: (n * 37) % 360 };
  $('menu').classList.add('hidden'); $('hud').classList.remove('hidden');
  resume();
}

function resume() { game.paused = false; $('pause').textContent = 'II'; cancelAnimationFrame(raf); last = performance.now(); acc = 0; raf = requestAnimationFrame(frame); }
function pause() { if (!game || game.paused) return; game.paused = true; $('pause').textContent = '▶'; cancelAnimationFrame(raf); draw(); }

function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  while (acc >= DT && !game.restart) { update(DT); acc -= DT; }
  if (game.restart) { startLevel(game.n); return; }
  draw();
  if (!game.paused && !game.exit) raf = requestAnimationFrame(frame);
}

function update(dt) {
  const g = game;
  for (const p of g.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 40 * dt; p.life -= dt; }
  g.parts = g.parts.filter(p => p.life > 0);
  if (g.dead) { if ((g.dead -= dt) <= 0) g.restart = true; return; }
  if (g.won) { g.px += SPEED * dt; if ((g.won -= dt) <= 0) finish(); return; }

  const speed = g.endless ? SPEED * (1 + Math.min(0.35, g.px / 4000)) : SPEED;
  if (g.endless) {
    while (g.x < g.px + 60) g.x = extend(g.obs, g.x, Math.min(0.95, 0.1 + g.px / 1500), g.r);
    if (g.obs.length > 200 && g.obs[0].x < g.px - 20) g.obs.splice(0, 50);
  }
  if (holding && g.ground) { g.vy = JUMP; g.ground = false; }
  const prevY = g.py;
  g.px += speed * dt;
  g.vy -= GRAV * dt;
  g.py += g.vy * dt;
  g.ground = false;
  if (g.py <= 0) { g.py = 0; g.vy = 0; g.ground = true; }

  // player box: x [px+0.08, px+0.92], y [py, py+0.9]
  const x0 = g.px + 0.08, x1 = g.px + 0.92;
  for (const o of g.obs) {
    if (o.x > x1 + 1) break;
    if (o.x + (o.w || 1) < x0) continue;
    if (o.b) {
      const top = o.y + o.h;
      if (x1 > o.x && x0 < o.x + o.w && g.py < top && g.py + 0.9 > o.y) {
        if (prevY >= top - 0.05 && g.vy <= 0) { g.py = top; g.vy = 0; g.ground = true; }
        else return die();
      }
    } else if (x1 > o.x + 0.25 && x0 < o.x + 0.75 && g.py < o.y + 0.6 && g.py + 0.9 > o.y) return die();
  }
  if (g.ground) g.rot = Math.round(g.rot / (Math.PI / 2)) * (Math.PI / 2);
  else g.rot += 7.5 * dt;
  if (!g.endless && g.px >= g.length) { g.won = 1.2; burst(30, '#ffe066'); saveBest(100); unlock(g.n + 1); }
}

function die() {
  const g = game; g.dead = 0.7;
  burst(40, `hsl(${g.hue + 180},90%,65%)`);
  if (navigator.vibrate) navigator.vibrate(80);
  saveBest(g.endless ? Math.floor(g.px) : Math.min(99, Math.floor(100 * g.px / g.length)));
}

function burst(n, color) {
  const g = game;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 3 + Math.random() * 9;
    g.parts.push({ x: g.px + 0.5, y: g.py + 0.5, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.5, color });
  }
}

const key = n => 'leap.best.' + (n === 0 ? 'endless' : n);
function saveBest(v) { const k = key(game.n); if (v > +(localStorage.getItem(k) || 0)) localStorage.setItem(k, v); }
const unlocked = () => +(localStorage.getItem('leap.unlocked') || 1);
function unlock(n) { if (n > unlocked()) localStorage.setItem('leap.unlocked', Math.min(n, LEVELS)); }
function finish() { game.exit = true; showMenu(); }

function showMenu() {
  if (game) { game.exit = true; cancelAnimationFrame(raf); }
  $('hud').classList.add('hidden'); $('menu').classList.remove('hidden');
  const el = $('levels'); el.innerHTML = '';
  const u = unlocked();
  for (let n = 1; n <= LEVELS + 1; n++) {
    const lvl = n > LEVELS ? 0 : n, best = +(localStorage.getItem(key(lvl)) || 0);
    const b = document.createElement('button');
    const locked = lvl !== 0 && lvl > u;
    b.className = 'lv' + (locked ? ' locked' : '');
    b.innerHTML = lvl === 0
      ? `<b>Endless</b><small>Best ${best} tiles</small>`
      : `<b>Level ${lvl}</b><small>${best >= 100 ? 'Cleared ✓' : locked ? 'Locked' : `Best ${best}%`}</small><div class="bar"><i style="width:${best}%"></i></div>`;
    b.disabled = locked;
    b.onclick = () => { game = null; startLevel(lvl); };
    el.appendChild(b);
  }
}

function size() {
  const dpr = devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  T = Math.min(H / 8.5, W / 11);
  groundY = Math.min(H - T * 1.6, H * 0.5 + T * 3);   // portrait: keep the action mid-screen
  if (game) draw();
}

function draw() {
  const g = game; if (!g) return;
  const hue = g.hue + (g.endless ? g.px / 8 : 0);
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, `hsl(${hue},45%,12%)`); sky.addColorStop(1, `hsl(${hue + 30},55%,24%)`);
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  const camX = g.px - 3.5;
  const sx = x => (x - camX) * T, sy = y => groundY - y * T;
  // parallax stripes
  ctx.strokeStyle = `hsla(${hue},60%,60%,0.08)`; ctx.lineWidth = T * 0.5;
  for (let i = -1; i < W / (T * 3) + 2; i++) { const x = i * T * 3 - (camX * T * 0.3) % (T * 3); ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x - T * 2, groundY); ctx.stroke(); }
  // ground
  ctx.fillStyle = `hsl(${hue},40%,8%)`; ctx.fillRect(0, groundY, W, H - groundY);
  ctx.strokeStyle = `hsl(${hue},80%,70%)`; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();
  // finish line
  if (!g.endless) { const fx = sx(g.length); if (fx < W + T) { ctx.fillStyle = '#ffe06655'; ctx.fillRect(fx, 0, T * 0.3, groundY); } }
  // obstacles
  for (const o of g.obs) {
    const x = sx(o.x); if (x > W + T) break; if (x < -T * 12) continue;
    if (o.b) {
      ctx.fillStyle = `hsl(${hue},35%,14%)`; ctx.fillRect(x, sy(o.y + o.h), o.w * T, o.h * T);
      ctx.strokeStyle = `hsl(${hue},80%,70%)`; ctx.lineWidth = 2; ctx.strokeRect(x + 1, sy(o.y + o.h) + 1, o.w * T - 2, o.h * T - 2);
    } else {
      ctx.fillStyle = `hsl(${hue + 180},85%,60%)`;
      ctx.beginPath(); ctx.moveTo(x + T * 0.1, sy(o.y)); ctx.lineTo(x + T * 0.5, sy(o.y + 0.9)); ctx.lineTo(x + T * 0.9, sy(o.y)); ctx.closePath(); ctx.fill();
    }
  }
  // player
  if (!g.dead) {
    ctx.save(); ctx.translate(sx(g.px + 0.5), sy(g.py + 0.5)); ctx.rotate(g.rot);
    ctx.fillStyle = '#ffe066'; ctx.fillRect(-T * 0.45, -T * 0.45, T * 0.9, T * 0.9);
    ctx.strokeStyle = '#7a5c00'; ctx.lineWidth = 2; ctx.strokeRect(-T * 0.3, -T * 0.3, T * 0.6, T * 0.6);
    ctx.restore();
  }
  for (const p of g.parts) { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color; ctx.fillRect(sx(p.x), sy(p.y), T * 0.18, T * 0.18); }
  ctx.globalAlpha = 1;
  // progress
  if (!g.endless) {
    const f = Math.min(1, g.px / g.length);
    ctx.fillStyle = '#fff2'; ctx.fillRect(W * 0.25, 18, W * 0.5, 6); ctx.fillStyle = '#6cf'; ctx.fillRect(W * 0.25, 18, W * 0.5 * f, 6);
  }
  $('info').textContent = (g.endless ? `Endless · ${Math.floor(g.px)}` : `Level ${g.n} · ${Math.floor(100 * Math.min(1, g.px / g.length))}%`) + ` · try ${g.attempts}`;
  if (g.paused) { ctx.fillStyle = '#0008'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#fff'; ctx.font = '600 28px system-ui'; ctx.textAlign = 'center'; ctx.fillText('Paused — tap to go on', W / 2, H / 2); }
  if (g.won) { ctx.fillStyle = '#ffe066'; ctx.font = '700 36px system-ui'; ctx.textAlign = 'center'; ctx.fillText('LEVEL CLEARED', W / 2, H / 3); }
}

function press(on) {
  if (!game || game.exit || !$('menu').classList.contains('hidden')) return;
  if (on && game.paused) { resume(); return; }
  holding = on;
}
cv.addEventListener('pointerdown', e => { press(true); e.preventDefault(); });
addEventListener('pointerup', () => press(false));
addEventListener('pointercancel', () => press(false));
addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') { if (!e.repeat) press(true); e.preventDefault(); } if (e.key === 'Escape') showMenu(); });
addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') press(false); });
$('pause').onclick = e => { e.stopPropagation(); game.paused ? resume() : pause(); };
$('back').onclick = e => { e.stopPropagation(); showMenu(); };
document.addEventListener('visibilitychange', () => { if (document.hidden) { holding = false; pause(); } });
addEventListener('sp-pause', () => { holding = false; pause(); });   // sent by the app when it goes to the background
addEventListener('resize', size);
size(); showMenu();
</script>
</body>
</html>
