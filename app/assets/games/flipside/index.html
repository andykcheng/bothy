<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flipside</title>
<style>
  :root { --bg: #f6efe2; --ink: #2a2118; --dim: #7d6f60; --card: #fffaf1; --line: #e3d6c2; --green: #1f6b4f; --red: #c2402f;
    --gold: #e0a526; --navy: #23395b; --good: #2e8a4f; --bad: #c2402f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  #app { max-width: 520px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 10px 14px; background: #eadfcb; color: var(--ink); cursor: pointer; }
  button.go { background: var(--green); color: #fff; font-weight: 700; }
  button.warn { background: var(--red); color: #fff; font-weight: 700; }
  button:disabled { opacity: .35; }
  h1, h2, h3 { margin: 0; }
  .muted { color: var(--dim); }
  .money { font-variant-numeric: tabular-nums; }
  /* title */
  .title { padding: 18px 18px 26px; text-align: center; }
  .title h1 { font-size: 52px; letter-spacing: -1px; color: var(--navy); line-height: 1; margin-top: 6px; }
  .title h1 span { color: var(--red); }
  .title .tag { font-weight: 700; color: var(--green); margin-top: 4px; letter-spacing: 2px; text-transform: uppercase; font-size: 13px; }
  .title .story { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; line-height: 1.45; margin: 12px 0; }
  .title .btns { display: grid; gap: 8px; }
  .hero { position: relative; height: 150px; }
  .hero svg { height: 100%; width: 100%; }
  /* awning */
  .awning { height: 16px; background: repeating-linear-gradient(90deg, var(--c1) 0 28px, #fff8ec 28px 56px); }
  .scallop { height: 10px; background: radial-gradient(circle at 14px 0, var(--c1) 9.5px, transparent 10px) 0 0 / 56px 10px repeat-x,
    radial-gradient(circle at 42px 0, #fff8ec 9.5px, transparent 10px) 0 0 / 56px 10px repeat-x; }
  .sign { background: var(--c1); color: #fff; padding: 10px 14px 6px; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
  .sign h2 { font-size: 24px; }
  .sign .mk { font-size: 13px; opacity: .9; }
  .stats { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 10px 0; }
  .chip { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
  .stars { color: var(--gold); letter-spacing: 1px; }
  .goal { margin: 8px 10px 0; height: 8px; background: #e7dbc6; border-radius: 99px; overflow: hidden; }
  .goal i { display: block; height: 100%; background: linear-gradient(90deg, var(--green), #4fb27f); }
  .goaltxt { font-size: 12px; padding: 3px 12px 0; color: var(--dim); }
  .news { margin: 8px 10px 0; background: #fff3cf; border: 1px solid #f0d58a; border-radius: 10px; padding: 8px 10px; font-size: 14px; }
  .list { padding: 8px 10px 92px; display: grid; gap: 7px; }
  .row { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px; display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; }
  .ico { width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; }
  .ico svg { width: 44px; height: 44px; }
  .row .nm { font-weight: 700; }
  .row .have { font-size: 12px; color: var(--dim); }
  .row .pr { font-size: 17px; font-weight: 800; text-align: right; }
  .tagb { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 6px; margin-left: 4px; vertical-align: 2px; }
  .tagb.lo { background: #d8f0df; color: var(--good); } .tagb.hi { background: #fbe0dc; color: var(--bad); } .tagb.no { background: #eee; color: #888; }
  .row .acts { display: flex; gap: 5px; margin-top: 4px; justify-content: flex-end; }
  .row .acts button { padding: 6px 12px; font-size: 14px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fffaf1ee; border-top: 1px solid var(--line); backdrop-filter: blur(6px); }
  .bar .in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 6px; }
  .bar button { padding: 6px 2px; font-size: 12px; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
  .bar button b { font-size: 22px; line-height: 1; }
  .badge { position: absolute; top: 0; right: 18%; background: var(--red); color: #fff; font-size: 10px; border-radius: 99px; padding: 1px 5px; }
  /* sheets */
  .shade { position: fixed; inset: 0; background: #2a211866; display: flex; align-items: flex-end; justify-content: center; z-index: 5; }
  .sheet { background: var(--bg); width: 100%; max-width: 520px; border-radius: 18px 18px 0 0; padding: 14px 14px 18px; max-height: 92vh; overflow: auto; }
  .sheet.center { border-radius: 18px; margin: auto 12px; }
  .sheet h3 { font-size: 20px; margin-bottom: 6px; }
  .qty { display: grid; grid-template-columns: 48px 1fr 48px 64px; gap: 6px; align-items: center; margin: 10px 0; }
  .qty .n { text-align: center; font-size: 26px; font-weight: 800; }
  .sum { display: flex; justify-content: space-between; font-size: 16px; margin: 6px 0 10px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .msg { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 8px 0; font-size: 14px; }
  .order { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: grid; grid-template-columns: 40px 1fr auto; gap: 8px; align-items: center; margin-bottom: 6px; }
  .order .ico { width: 40px; height: 40px; } .order .ico svg { width: 32px; height: 32px; }
  .map { width: 100%; height: auto; display: block; }
  .city { cursor: pointer; }
  .event { text-align: center; }
  .event .big { width: 92px; height: 92px; margin: 4px auto 8px; border-radius: 20px; display: grid; place-items: center; font-size: 52px; }
  .event .big svg { width: 70px; height: 70px; }
  table.sc { width: 100%; border-collapse: collapse; font-size: 14px; } table.sc td { padding: 5px 4px; border-bottom: 1px solid var(--line); }
  .help p { margin: 6px 0; line-height: 1.4; }
</style>
</head>

// ---- state & random ---------------------------------------------------------------------------
let S = null, ui = null;
function rng() { // mulberry32 on S.seed
  let t = (S.seed = (S.seed + 0x6D2B79F5) | 0);
  t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const pick = a => a[Math.floor(rng() * a.length)];
const gauss = () => { let u = 0; for (let i = 0; i < 6; i++) u += rng(); return u - 3; }; // ~N(0, .7)
const gbp = n => '£' + Math.round(n).toLocaleString('en-GB');
const $ = id => document.getElementById(id);
const save = () => { if (S) localStorage.setItem(KEY, JSON.stringify(S)); };
const used = () => ITEMS.reduce((a, i) => a + (S.inv[i.id].checked + S.inv[i.id].unchecked) * i.space, 0);
const vanSpace = () => VANS[S.van].space;
const repFactor = () => .9 + .04 * S.rep;

function newGame() {
  const inv = {}; for (const i of ITEMS) inv[i.id] = { checked: 0, unchecked: 0, fakes: 0, cost: 0 };
  S = { seed: (Date.now() ^ (Math.random() * 1e9)) | 0, day: 1, cash: 1500, rep: 2, van: 0, city: 'london', inv,
        offers: [], orders: [], next: {}, news: [], log: [], over: false };
  arrive(true);
  S.news.unshift('Gran\'s notebook, first page: "Buy where it\'s cheap, sell where they love it. And always get the dear stuff checked."');
}

function arrive(first) {
  const c = CITY_BY[S.city];
  S.market = {}; S.haggled = {}; S.walked = {}; S.mood = 1; S.news = [];
  for (const i of ITEMS) {
    let p = i.base * taste(c, i.id) * Math.exp(gauss() * i.vol);
    const trend = S.next[S.city + ':' + i.id]; if (trend) { p *= trend; delete S.next[S.city + ':' + i.id]; S.news.push(`The tip was right: ${i.name.toLowerCase()} prices have jumped here.`); }
    const big = i.base > 2000;
    S.market[i.id] = { price: Math.max(5, Math.round(p)), stock: rng() < .87 ? (big ? 1 + Math.floor(rng() * 3) : 2 + Math.floor(rng() * 6)) : 0 };
  }
  if (!first) event();
  newOrder();
  expireOrders();
  save();
}

// ---- events ---------------------------------------------------------------------------------
function event() {
  if (rng() > .45) return;
  const c = CITY_BY[S.city], r = rng(), it = pick(ITEMS);
  const m = S.market[it.id];
  if (r < .16) { m.price = Math.round(m.price * (1.8 + rng() * .8)); show('trend', 'Everyone wants one', `A pop star was snapped with a ${it.name.toLowerCase()} last night. Prices in ${c.name} have shot up.`, it.id); }
  else if (r < .30) { const d = pick(['A new model has just been announced', 'A big restock landed this morning', 'A celebrity said they\'re "so over it"']);
    m.price = Math.round(m.price * (.45 + rng() * .2)); show('crash', 'Prices crash', `${d}: ${it.name.toLowerCase()} prices in ${c.name} have collapsed. Buying opportunity?`, it.id); }
  else if (r < .42) { const city = pick(CITIES.filter(x => x.id !== S.city)); S.next[city.id + ':' + it.id] = 1.7 + rng() * .6;
    show('tip', 'A tip from Gran\'s friend', `Old Maureen from the flower stall whispers: "${it.name}s will be big in ${city.name} soon. Get there before the rush."`, it.id); }
  else if (r < .56) { const price = Math.round(it.base * (.3 + rng() * .25)); S.offers = [{ item: it.id, price, fake: .35 }];
    show('boot', 'Car boot sale', `On the way in you pass a car boot sale. Someone's selling a ${it.name.toLowerCase()} for just ${gbp(price)}. It looks real… mostly.`, it.id, true); }
  else if (r < .64) { const f = Math.min(S.cash, 70); S.cash -= f; show('ticket', 'Parking ticket', `You were only in the loading bay for ten minutes. ${gbp(f)} fine.`); }
  else if (r < .71) { const f = Math.min(S.cash, Math.round(120 + rng() * 230)); S.cash -= f; show('van', 'Van trouble', `Gran's van coughs, splutters and needs a new part. The garage charges ${gbp(f)}.`); }
  else if (r < .80) { S.mood = .85; show('rain', 'Pouring with rain', `Hardly anyone's out at ${c.market} today. Buyers are paying about 15% less.`); }
  else if (r < .90) { S.mood = 1.15; show('fest', 'Festival weekend', `${c.name} is packed with visitors. Buyers are paying about 15% more today.`); }
  else { if (S.rep < 5) S.rep++; show('deed', 'Good deed', `You hand back a purse someone dropped by the stalls. Word gets round: your reputation goes up.`); }
}
const EV = { trend: ['#fff1c7', '📈'], crash: ['#e2f0ff', '📉'], tip: ['#efe6ff', '🌷'], boot: ['#e6f3df', '🚗'], ticket: ['#ffe2dc', '🅿️'],
             van: ['#ffe2dc', '🔧'], rain: ['#e2ecf5', '🌧️'], fest: ['#fff1c7', '🎪'], deed: ['#e6f3df', '👛'] };
function show(kind, title, text, item, offer) { S.pending = { kind, title, text, item, offer }; }

// ---- orders (Gran's black book) ---------------------------------------------------------------
function newOrder() {
  if (S.orders.filter(o => !o.taken).length >= 3 || rng() > .4) return;
  const city = pick(CITIES.filter(x => x.id !== S.city)), it = pick(ITEMS);
  const qty = it.base < 600 && rng() < .5 ? 2 : 1;
  const who = pick(['Mrs Okafor', 'A film prop buyer', 'Dr Patel', 'A collector', 'Mr Nowak', 'A vintage shop', 'Ailsa from the gallery', 'A wedding planner', 'Mr Hughes', 'A TV producer']);
  S.orders.push({ id: Date.now() + '' + Math.floor(rng() * 1e6), who, city: city.id, item: it.id, qty, pay: Math.round(it.base * qty * (1.5 + rng() * .3) / 10) * 10,
                  due: S.day + 5 + Math.floor(rng() * 6), taken: false });
}
function expireOrders() {
  for (const o of S.orders) if (o.due < S.day) { if (o.taken) { S.rep = Math.max(0, S.rep - 1); S.news.push(`You let ${o.who} down in ${CITY_BY[o.city].name}. Your reputation drops.`); } o.gone = true; }
  S.orders = S.orders.filter(o => !o.gone);
}

// ---- trading ---------------------------------------------------------------------------------
const buyPrice = id => S.market[id].price;
const SPREAD = .93, TASTE = 1.5; // dealers' margin; how strongly each city's tastes move prices
const taste = (c, id) => 1 + ((c.m[id] || 1) - 1) * TASTE;
const sellPrice = id => Math.round(S.market[id].price * SPREAD * repFactor() * S.mood);
function maxBuy(id) {
  const i = ITEMS_BY[id];
  return Math.max(0, Math.min(S.market[id].stock, Math.floor(S.cash / buyPrice(id)), Math.floor((vanSpace() - used()) / i.space)));
}
function doBuy(id, n, price, fakeP) {
  const v = S.inv[id], i = ITEMS_BY[id];
  if (fakeP === undefined) fakeP = price < i.base * taste(CITY_BY[S.city], id) * .8 ? .3 : .05; // too cheap to be true?
  let f = 0; for (let k = 0; k < n; k++) if (rng() < fakeP) f++;
  v.cost = (v.cost * (v.checked + v.unchecked) + price * n) / (v.checked + v.unchecked + n);
  v.unchecked += n; v.fakes += f; S.cash -= price * n;
}
function doSell(id, n, price) {
  const v = S.inv[id]; let fromChecked = Math.min(n, v.checked), fromUn = n - fromChecked, fakesSold = 0;
  for (let k = 0; k < fromUn; k++) { if (rng() < v.fakes / v.unchecked) { v.fakes--; fakesSold++; } v.unchecked--; }
  v.checked -= fromChecked;
  let caught = 0; for (let k = 0; k < fakesSold; k++) if (rng() < .75) caught++;
  S.cash += price * (n - caught);
  if (!v.checked && !v.unchecked) v.cost = 0;
  if (caught) { S.rep = Math.max(0, S.rep - 1); return `The buyer had ${caught > 1 ? caught + ' of them' : 'it'} checked: fake! You refund ${gbp(price * caught)} and your reputation drops.`; }
  return `Sold ${n} for ${gbp(price * n)}.`;
}
const checkFee = id => Math.max(15, Math.round(ITEMS_BY[id].base * .04));

    She's given you her van, <b>£1,500</b>, and her black book of collectors. You have <b>${DAYS} days</b> to find watches, rings, handbags, trainers and other hard-to-get things at a good price and sell them where people love them.</div>

function main() {
  const c = CITY_BY[S.city];

  app.innerHTML = `<div style="--c1:${c.c}"><div class="sign"><div><div class="mk">${c.market}</div><h2>${c.name}</h2></div><div class="mk">Day <b>${S.day}</b> of ${DAYS}</div></div><div class="awning"></div><div class="scallop"></div></div>
    <div class="stats"><span class="chip money">💷 ${gbp(S.cash)}</span><span class="chip">🚐 ${used()}/${vanSpace()}</span><span class="chip"><span class="stars">${'★'.repeat(S.rep)}<span style="color:#d9cbb3">${'★'.repeat(5 - S.rep)}</span></span></span></div>

  if (S.pending) popEvent();

function row(i) {
  const m = S.market[i.id], v = S.inv[i.id], have = v.checked + v.unchecked;
  const rel = m.price / i.base;
  const tag = !m.stock ? '<span class="tagb no">none for sale</span>' : rel < .8 ? '<span class="tagb lo">bargain</span>' : rel > 1.25 ? '<span class="tagb hi">hot</span>' : '';
  const sold = S.walked[i.id];
  return `<div class="row">${icon(i.id)}<div><div class="nm">${i.name}${tag}</div>
    <div class="have">${have ? `You have ${have}${v.unchecked ? ` (${v.unchecked} unchecked)` : ' ✓'} · paid ${gbp(v.cost)} each` : (m.stock ? `${m.stock} for sale` : 'none for sale today')}${i.space > 1 ? ' · takes 2 spaces' : ''}</div></div>
    <div><div class="pr money">${gbp(m.price)}</div><div class="acts">
      <button data-buy="${i.id}" ${!m.stock || sold === 'buy' || maxBuy(i.id) < 1 ? 'disabled' : ''}>Buy</button>
      <button class="go" data-sell="${i.id}" ${!have || sold === 'sell' ? 'disabled' : ''}>Sell</button></div></div></div>`;
}

function sheet(html, center) {
  const d = document.createElement('div'); d.className = 'shade';
  d.innerHTML = `<div class="sheet${center ? ' center' : ''}">${html}</div>`;
  d.onclick = e => { if (e.target === d) close(); };
  document.body.appendChild(d); ui = d; return d;
}
function close() { if (ui) ui.remove(); ui = null; }

function trade(id, side) {
  const i = ITEMS_BY[id], v = S.inv[id];
  let price = side === 'buy' ? buyPrice(id) : sellPrice(id), n = 1, note = '';
  const max = () => side === 'buy' ? Math.max(0, Math.min(S.market[id].stock, Math.floor(S.cash / price), Math.floor((vanSpace() - used()) / i.space))) : v.checked + v.unchecked;
  const draw = () => {
    n = Math.max(Math.min(n, max()), max() ? 1 : 0);
    const k = S.haggled[id + side];
    ui.querySelector('.sheet').innerHTML = `<div style="display:flex;gap:12px;align-items:center">${icon(id)}<div><h3>${side === 'buy' ? 'Buy' : 'Sell'} ${i.name.toLowerCase()}</h3>
      <div class="muted">${side === 'buy' ? `${S.market[id].stock} for sale at ${gbp(price)} each` : `Buyers here pay ${gbp(price)} each${v.cost ? ` · you paid ${gbp(v.cost)}` : ''}`}</div></div></div>
      ${note ? `<div class="msg">${note}</div>` : ''}
      ${side === 'sell' && v.unchecked ? `<div class="msg">⚠️ ${v.unchecked} unchecked. If one turns out fake, the buyer may find out.</div>` : ''}
      ${side === 'buy' && price < i.base * taste(CITY_BY[S.city], id) * .8 ? `<div class="msg">🤔 That's a very low price. Could some be fakes?</div>` : ''}
      <div class="qty"><button id="minus">−</button><div class="n" id="n">${n}</div><button id="plus">+</button><button id="mx">Max</button></div>
      <div class="sum"><span>Total</span><b class="money">${gbp(price * n)}</b></div>
      <div class="two"><button id="hag" ${k ? 'disabled' : ''}>${k ? 'Haggled' : 'Haggle'}</button><button class="go" id="ok" ${n ? '' : 'disabled'}>${side === 'buy' ? 'Buy' : 'Sell'}</button></div>`;
    $('minus').onclick = () => { n--; draw(); }; $('plus').onclick = () => { n++; draw(); }; $('mx').onclick = () => { n = max(); draw(); };
    $('hag').onclick = () => {
      S.haggled[id + side] = 1; const r = rng();
      if (r < .55) { price = Math.round(price * (side === 'buy' ? .88 : 1.12)); note = side === 'buy' ? `"Go on then." The seller knocks it down to ${gbp(price)}.` : `"Fine, fine." The buyer goes up to ${gbp(price)}.`; }
      else if (r < .85) note = `"That's my best price." No change.`;
      else { S.walked[id] = side; close(); S.news = [`You pushed too hard: the ${side === 'buy' ? 'seller' : 'buyer'} walked off. No more ${i.name.toLowerCase()} deals here today.`]; save(); main(); return; }
      draw();
    };
    $('ok').onclick = () => {
      if (side === 'buy') { doBuy(id, n, price); S.market[id].stock -= n; S.news = [`Bought ${n} × ${i.name.toLowerCase()} for ${gbp(price * n)}.`]; }
      else S.news = [doSell(id, n, price)];
      close(); save(); main();
    };
  };
  sheet(''); draw();
}

function popEvent() {
  const e = S.pending; S.pending = null; save();
  const [bg, emo] = EV[e.kind];
  const art = e.item && (e.kind === 'trend' || e.kind === 'crash' || e.kind === 'tip' || e.kind === 'boot') ? `<svg viewBox="0 0 64 64">${ART[e.item]}</svg>` : emo;
  sheet(`<div class="event"><div class="big" style="background:${bg}">${art}</div><h3>${e.title}</h3><p>${e.text}</p>
    ${e.offer ? `<div class="two"><button id="no">No thanks</button><button class="go" id="yes">Buy it</button></div>` : `<button class="go" id="ok" style="width:100%">OK</button>`}</div>`, true);
  if (e.offer) {
    const o = S.offers[0], it = ITEMS_BY[o.item];
    $('yes').disabled = S.cash < o.price || vanSpace() - used() < it.space;
    $('yes').onclick = () => { doBuy(o.item, 1, o.price, o.fake); S.offers = []; S.news.unshift(`Bought a car boot ${it.name.toLowerCase()} for ${gbp(o.price)}. Better get it checked.`); close(); save(); main(); };
    $('no').onclick = () => { S.offers = []; close(); save(); };
  } else $('ok').onclick = () => { close(); main(); };
}

function travel() {
  const here = CITY_BY[S.city];
  const cost = c => Math.round(Math.hypot(c.x - here.x, c.y - here.y) * 1.36 * .25 + 10 + (c.ferry || 0) + (here.ferry || 0));
  sheet(`<h3>Where to?</h3><div class="muted">Each trip takes a day. Fuel and the Belfast ferry cost money.</div>
    <svg class="map" viewBox="0 0 300 466"><rect width="300" height="466" fill="#cfe6ef" rx="12"/><path d="${GB}" fill="#f1e7d2" stroke="#b9a988" stroke-width="1"/>
    ${CITIES.map(c => { const me = c.id === S.city, k = cost(c);
      return `<g class="city" data-go="${c.id}"><circle cx="${c.x}" cy="${c.y}" r="${me ? 9 : 7}" fill="${c.c}" stroke="#fff" stroke-width="2.5"/>${me ? `<circle cx="${c.x}" cy="${c.y}" r="14" fill="none" stroke="${c.c}" stroke-width="2" stroke-dasharray="3 3"/>` : ''}
      <circle cx="${c.x}" cy="${c.y}" r="18" fill="transparent"/><text x="${c.x + (c.l ? c.l[0] : 12)}" y="${c.y + (c.l ? c.l[1] : 4)}" text-anchor="${c.l ? c.l[2] : 'start'}" font-size="12" font-weight="700" fill="#2a2118" stroke="#f6efe2" stroke-width="3" paint-order="stroke">${c.name}${me ? ' (here)' : ` · ${gbp(k)}`}</text></g>`; }).join('')}</svg>
    <div class="two" style="margin-top:8px"><button id="stay">Stay here a day</button><button id="x">Cancel</button></div>`);
  for (const g of ui.querySelectorAll('[data-go]')) g.onclick = () => { const c = CITY_BY[g.dataset.go]; if (c.id === S.city) return; const k = cost(c);
    if (S.cash < k) { alert(`You need ${gbp(k)} for the trip.`); return; } S.cash -= k; go(c.id); };
  $('stay').onclick = () => go(S.city); $('x').onclick = close;
}
function go(city) {
  close(); S.day++; S.city = city;
  if (S.day > DAYS) { S.day = DAYS; return end(); }
  arrive(); main();
}

function book() {
  const taken = S.orders.filter(o => o.taken), free = S.orders.filter(o => !o.taken);
  const card = (o, b) => `<div class="order">${icon(o.item)}<div><b>${o.who}</b>, ${CITY_BY[o.city].name}<div class="muted" style="font-size:13px">${o.qty} × ${ITEMS_BY[o.item].name.toLowerCase()} · ${gbp(o.pay)} · by day ${o.due}</div></div>${b}</div>`;
  sheet(`<h3>📒 Gran's black book</h3><div class="muted">Collectors pay well, but they check everything: only <b>checked</b> items count. Let one down and your reputation suffers.</div>
    <h4 style="margin:12px 0 6px">Promised</h4>${taken.map(o => card(o, '')).join('') || '<div class="muted">Nothing promised yet.</div>'}
    <h4 style="margin:12px 0 6px">New requests</h4>${free.map(o => card(o, `<button class="go" data-take="${o.id}" ${taken.length >= 2 || S.rep < 1 ? 'disabled' : ''}>Promise</button>`)).join('') || '<div class="muted">No requests right now. New ones turn up as you travel.</div>'}
    ${taken.length >= 2 ? '<div class="muted" style="margin-top:6px">You can promise two at a time.</div>' : ''}
    <button style="width:100%;margin-top:10px" id="x">Close</button>`);
  for (const b of ui.querySelectorAll('[data-take]')) b.onclick = () => { S.orders.find(o => o.id === b.dataset.take).taken = true; save(); close(); book(); };
  $('x').onclick = () => { close(); main(); };
}
function deliver(id) {
  const o = S.orders.find(x => x.id === id), v = S.inv[o.item];
  if (v.checked < o.qty) { S.news = [`${o.who} only accepts checked items. You need ${o.qty} checked ${ITEMS_BY[o.item].name.toLowerCase()}${o.qty > 1 ? 's' : ''} (you have ${v.checked}).`]; return main(); }
  v.checked -= o.qty; if (!v.checked && !v.unchecked) v.cost = 0;
  S.cash += o.pay; if (S.rep < 5) S.rep++; S.orders = S.orders.filter(x => x !== o);
  S.news = [`${o.who} is thrilled and pays ${gbp(o.pay)}. Your reputation goes up.`]; save(); main();
}

function checks() {
  const list = ITEMS.filter(i => S.inv[i.id].unchecked);
  sheet(`<h3>🔍 Get things checked</h3><div class="muted">An authenticator at the market looks over each item. Fakes are binned; genuine ones are certified, so buyers and collectors trust them.</div>
    ${list.map(i => `<div class="order">${icon(i.id)}<div><b>${i.name}</b><div class="muted" style="font-size:13px">${S.inv[i.id].unchecked} unchecked · ${gbp(checkFee(i.id))} each</div></div><button class="go" data-chk="${i.id}" ${S.cash < checkFee(i.id) * S.inv[i.id].unchecked ? 'disabled' : ''}>${gbp(checkFee(i.id) * S.inv[i.id].unchecked)}</button></div>`).join('') || '<div class="msg">Everything you carry is already checked. ✓</div>'}
    <button style="width:100%;margin-top:10px" id="x">Close</button>`);
  for (const b of ui.querySelectorAll('[data-chk]')) b.onclick = () => {
    const id = b.dataset.chk, v = S.inv[id], n = v.unchecked, f = v.fakes;
    S.cash -= checkFee(id) * n; v.checked += n - f; v.unchecked = 0; v.fakes = 0; if (!v.checked) v.cost = 0;
    S.news = [f ? `The authenticator found ${f} fake${f > 1 ? 's' : ''} among your ${ITEMS_BY[id].name.toLowerCase()}s. Binned. ${n - f} genuine.` : `All ${n} genuine. Certified ✓`];
    save(); close(); checks();
  };
  $('x').onclick = () => { close(); main(); };
}

function van() {
  const nx = VANS[S.van + 1];
  sheet(`<div class="event"><div class="hero" style="height:120px">${VAN}</div><h3>${VANS[S.van].name}</h3><p class="muted">${used()} of ${vanSpace()} spaces used. Handbags, trainers and consoles take two spaces.</p>
    ${nx ? `<div class="msg">Upgrade to a <b>${nx.name}</b>: ${nx.space} spaces, ${gbp(nx.cost)}.</div><button class="go" id="up" style="width:100%" ${S.cash < nx.cost ? 'disabled' : ''}>Upgrade for ${gbp(nx.cost)}</button>` : '<div class="msg">This is the biggest van there is.</div>'}
    <button id="x" style="width:100%;margin-top:8px">Close</button></div>`, true);
  if (nx) $('up').onclick = () => { S.cash -= nx.cost; S.van++; S.news = [`New wheels! Your ${nx.name.toLowerCase()} holds ${nx.space}.`]; save(); close(); main(); };
  $('x').onclick = close;
}

function menu() {
  sheet(`<h3>Menu</h3>${S.cash >= GOAL ? `<div class="msg">You have ${gbp(S.cash)}: enough to save the shop. Finish now, or keep trading until day ${DAYS} for a bigger total.</div><button class="go" id="fin" style="width:100%">Pay the landlord and finish</button>` : ''}
    <div class="two" style="margin-top:8px"><button id="how">How to play</button><button id="ttl">Title screen</button></div><button id="x" style="width:100%;margin-top:8px">Close</button>`);
  if ($('fin')) $('fin').onclick = () => { close(); end(); };
  $('how').onclick = () => { close(); help(); }; $('ttl').onclick = () => { close(); save(); title(); }; $('x').onclick = close;
}

function help() {
  sheet(`<div class="help"><h3>How to play</h3>
    <p>🛒 <b>Buy low, sell high.</b> Every market loves some things and undervalues others, and prices change every day. Look for <span class="tagb lo">bargain</span> and <span class="tagb hi">hot</span>.</p>
    <p>🗺️ <b>Travel</b> takes a day and costs fuel. Or stay put for a day and see new prices.</p>
    <p>🔍 <b>Fakes.</b> Deals that look too good, and car boot finds, may be fakes. Get things checked before you sell. If a buyer finds a fake, you refund them and your reputation drops.</p>
    <p>⭐ <b>Reputation</b> raises the prices buyers will pay you. Deliver to collectors and do good deeds to raise it.</p>
    <p>📒 <b>Gran's black book</b> has collectors who pay well over the odds for checked items, delivered on time.</p>
    <p>🤝 <b>Haggle</b> once per deal. You might get 12% off, or nothing, or the other side walks away.</p>
    <p>🚐 A bigger <b>van</b> carries more.</p>
    <p>🏠 Have <b>${gbp(GOAL)}</b> by day ${DAYS} to save Gran's shop. The more you make, the better your title.</p>
    <button class="go" id="x" style="width:100%">Got it</button></div>`);
  $('x').onclick = close;
}

const RANKS = [[0, 'Car boot beginner', 'The shop closes. Gran still says she\'s proud of you.'], [GOAL, 'Market trader', 'Gran\'s shop is saved!'],
               [50000, 'Dealer of note', 'The shop is saved, and there\'s money for a new sign.'], [90000, 'Local legend', 'People come from all over Britain to visit the shop.'],
               [150000, 'Grail master', 'You found every grail worth finding. Gran frames your first receipt.']];
function end() {
  S.over = true; save();
  const r = [...RANKS].reverse().find(x => S.cash >= x[0]);
  const runs = JSON.parse(localStorage.getItem(BEST) || '[]');
  if (!S.scored) { runs.push({ cash: Math.round(S.cash), day: S.day, rank: r[1], date: new Date().toISOString().slice(0, 10) }); runs.sort((a, b) => b.cash - a.cash); localStorage.setItem(BEST, JSON.stringify(runs.slice(0, 8))); S.scored = true; save(); }
  const left = ITEMS.reduce((a, i) => a + S.inv[i.id].checked + S.inv[i.id].unchecked, 0);
  app.innerHTML = `<div class="title"><div class="hero">${VAN}</div><div class="tag">Day ${S.day} · final total</div><h1 style="font-size:46px">${gbp(S.cash)}</h1>
    <div class="story" style="text-align:center"><b style="font-size:20px">${r[1]}</b><br>${r[2]}${left ? `<br><span class="muted">(${left} unsold item${left > 1 ? 's' : ''} left in the van.)</span>` : ''}</div>
    <div class="btns"><button class="go" id="again">Play again</button><button id="best">Best runs</button></div></div>`;
  $('again').onclick = () => { localStorage.removeItem(KEY); newGame(); main(); }; $('best').onclick = best;
}
function best() {
  const runs = JSON.parse(localStorage.getItem(BEST) || '[]');
  sheet(`<h3>Best runs</h3>${runs.length ? `<table class="sc">${runs.map((r, k) => `<tr><td>${k + 1}</td><td class="money"><b>${gbp(r.cash)}</b></td><td>${r.rank}</td><td class="muted">${r.date}</td></tr>`).join('')}</table>` : '<div class="muted">No finished runs yet.</div>'}
    <button id="x" style="width:100%;margin-top:10px">Close</button>`);
  $('x').onclick = close;
}

document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('sp-pause', save);
if (location.hash === '#cover') { // the 600x450 picture for the games grid (game.json cover)
  app.innerHTML = `<div class="title" style="padding:10px 22px;height:100vh;display:flex;flex-direction:column;justify-content:center"><div class="hero" style="height:150px">${VAN}</div><div class="tag">Buy rare · sell high</div><h1>Flip<span>side</span></h1>
    <div style="display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:22px">${ITEMS.map(i => icon(i.id)).join('')}</div></div>`;
} else title();
</script>
</body>
</html>
