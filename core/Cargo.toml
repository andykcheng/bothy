[workspace]
resolver = "2"
members = ["crates/sp-pack", "crates/sp-search", "crates/sp-embed", "crates/sp-maps", "crates/sp-cli", "crates/sp-server", "crates/sp-ffi", "crates/sp-rag"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
blake3 = { version = "1.8", features = ["mmap", "rayon"] }
clap = { version = "4.6", features = ["derive"] }
fst = "0.4"
half = "2.7"
memmap2 = "0.9"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.26.1"
unicode-normalization = "0.1"
zstd = { version = "0.13", features = ["zdict_builder"] }
sp-pack = { path = "crates/sp-pack" }
sp-search = { path = "crates/sp-search" }
sp-embed = { path = "crates/sp-embed" }
sp-maps = { path = "crates/sp-maps" }
sp-rag = { path = "crates/sp-rag" }

[profile.release]
debug = 1
